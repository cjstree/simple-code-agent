[project]
name = "standalone-code-agent"
version = "0.1.0"
description = "A small standalone CLI coding agent with optional MCP tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.28.0",
    "mcp>=2.0.0",
    "openai>=1.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
telemetry = [
    "arize-phoenix-otel>=0.16.0",
    "openinference-instrumentation-openai>=0.1.41",
]

[project.scripts]
code-agent = "code_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
